# BF Tickets — bot de atendimento (WhatsApp + Instagram). Local e VPS usam este mesmo arquivo.
# Portas só em 127.0.0.1: na VPS quem expõe é o Caddy (docs/DEPLOY_VPS.md).
name: bf-tickets

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    <<: *restart
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ADMIN_NUMERO: ${ADMIN_NUMERO}
      PAUSA_HUMANO_HORAS: ${PAUSA_HUMANO_HORAS:-12}
      TZ: ${GENERIC_TIMEZONE:-America/Bahia}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/mensagens.sql:/docker-entrypoint-initdb.d/20-mensagens.sql:ro
      - ./db/zz-config.sh:/docker-entrypoint-initdb.d/90-config.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *restart
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  evolution:
    <<: *restart
    image: evoapicloud/evolution-api:v2.3.7
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-8095}:8080"
    environment:
      SERVER_URL: http://localhost:${EVOLUTION_PORT:-8095}
      SERVER_PORT: 8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: bf-tickets
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"   # o painel busca o comprovante pelo id (getBase64FromMediaMessage)
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: ${REDIS_URL:-redis://redis:6379/6}
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: BF Tickets
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 30
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN
      TZ: ${GENERIC_TIMEZONE:-America/Bahia}
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      # GET / consulta a versão do WhatsApp Web na internet: checar só a porta.
      test: ["CMD", "node", "-e", "require('net').connect(8080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  n8n:
    <<: *restart
    image: docker.n8n.io/n8nio/n8n:2.45.5
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:${N8N_PORT:-5679}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Bahia}
      TZ: ${GENERIC_TIMEZONE:-America/Bahia}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none     # LGPD: só erros ficam guardados
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"     # $env só para valores não secretos; segredos ficam em credenciais
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      # Valores lidos pelos workflows via $env
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      DEBOUNCE_SEGUNDOS: ${DEBOUNCE_SEGUNDOS:-6}
      PAUSA_HUMANO_HORAS: ${PAUSA_HUMANO_HORAS:-12}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  nocodb:
    <<: *restart
    image: nocodb/nocodb:2026.10.1
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:${NOCODB_PORT:-8096}:8080"
    environment:
      NC_DB: pg://postgres:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=nocodb
      NC_AUTH_JWT_SECRET: ${NOCODB_JWT_SECRET}
      NC_ADMIN_EMAIL: ${NOCODB_ADMIN_EMAIL}
      NC_ADMIN_PASSWORD: ${NOCODB_ADMIN_PASSWORD}
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
      NC_DISABLE_TELE: "true"
      TZ: ${GENERIC_TIMEZONE:-America/Bahia}
    volumes:
      - nocodb_data:/usr/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  painel:
    <<: *restart
    build: ./painel
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:${PAINEL_PORT:-5195}:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PAINEL_USUARIO: ${PAINEL_USUARIO}
      PAINEL_SENHA: ${PAINEL_SENHA}
      PAINEL_TOKEN: ${PAINEL_TOKEN}
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      EVOLUTION_WEBHOOK: http://n8n:5678/webhook/evolution
      N8N_URL: http://n8n:5678
      MANYCHAT_API_KEY: ${MANYCHAT_API_KEY:-}
      LINK_N8N: ${LINK_N8N:-http://localhost:5679}
      LINK_NOCODB: ${LINK_NOCODB:-http://localhost:8096}
      WEBHOOK_URL: ${WEBHOOK_URL}
      TZ: ${GENERIC_TIMEZONE:-America/Bahia}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Só em desenvolvimento (make tunel): URL pública temporária para o webhook do ManyChat.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    profiles: ["dev"]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://n8n:5678
    depends_on:
      n8n: { condition: service_healthy }

volumes:
  pg_data:
  evolution_instances:
  n8n_data:
  nocodb_data:
